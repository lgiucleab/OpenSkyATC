<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/SCSS/common.css" />
    <link rel="stylesheet" href="OpenSkyATC.css" />

    <script type="text/javascript" src="/JS/coherent.js"></script>
    <script type="text/javascript" src="/JS/common.js"></script>
    <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>
    <script type="text/javascript" src="/JS/Services/CommBus.js"></script>
    <link rel="import" href="/templates/ingameUi/ingameUi.html" />

    <script type="text/javascript" src="OpenSkyATCView.js"></script>
    <script type="text/javascript" src="OpenSkyATC.js"></script>
</head>

<body class="border-box">
    <opensky-atc-panel>
        <ingame-ui id="OpenSkyATCPanel" panel-id="PANEL_OPENSKYATC" title="OpenSkyATC" class="ingameUiFrame panelInvisible" min-width="260" min-height="200">
            <div id="osa">
                <!-- Radio head: callsign and link above a display with COM, active and standby frequency, station, transmit lamp -->
                <div class="osa-head">
                    <div class="osa-ident">
                        <span id="osa-title" class="osa-callsign"></span>
                        <span class="osa-status"><span id="osa-dot" class="osa-dot"></span><span id="osa-subtitle"></span></span>
                    </div>
                    <div class="osa-display">
                        <div class="osa-line">
                            <span id="osa-com" class="osa-com">COM1</span>
                            <span id="osa-frequency" class="osa-active"></span>
                            <span id="osa-swap" class="osa-swap">&#x25C2;&#x25B8;</span>
                            <span id="osa-standby" class="osa-standby"></span>
                        </div>
                        <div class="osa-line osa-sub">
                            <span id="osa-unit" class="osa-unit"></span>
                            <span id="osa-ptt" class="osa-tx">TX</span>
                        </div>
                    </div>
                </div>
                <div id="osa-hint" class="osa-hint"></div>
                <!-- The latest call -->
                <div id="osa-message" class="osa-message">
                    <span id="osa-who" class="osa-who"></span>
                    <span id="osa-said" class="osa-said"></span>
                </div>
                <!-- One large action, then the others -->
                <div id="osa-action" class="osa-action">
                    <span id="osa-action-title" class="osa-action-title"></span>
                    <span id="osa-action-detail" class="osa-action-detail"></span>
                    <span id="osa-action-timer" class="osa-action-timer"></span>
                </div>
                <div id="osa-voice-readback" class="osa-voice"></div>
                <div id="osa-buttons" class="osa-buttons"></div>
                <div id="osa-arrows" class="osa-toggle"></div>
            </div>
        </ingame-ui>
    </opensky-atc-panel>
</body>
</html>
